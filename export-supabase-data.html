<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Exportar Datos Supabase - Casa Leo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c10;
      color: #e6edf3;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 30px;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #8b949e;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .status {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      font-family: monospace;
      font-size: 13px;
      min-height: 100px;
      overflow-y: auto;
      max-height: 300px;
    }
    .status-item {
      padding: 5px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-item.loading::before { content: '⏳'; animation: spin .8s linear infinite; }
    .status-item.success::before { content: '✅'; }
    .status-item.error::before { content: '❌'; color: #ef4444; }
    .status-item.info::before { content: 'ℹ️'; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      background: #f97316;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }
    .btn:hover { background: #ea580c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .summary {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      display: none;
    }
    .summary.show { display: block; }
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #30363d;
      font-size: 13px;
    }
    .summary-item:last-child { border-bottom: none; }
    .text-success { color: #22c55e; }
    .text-error { color: #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔨 Casa Leo</h1>
  <div class="subtitle">Exportar datos de Supabase</div>
  
  <div class="status" id="status"></div>
  
  <button class="btn" id="exportBtn" onclick="startExport()">
    📥 Exportar Datos Ahora
  </button>
  
  <div class="summary" id="summary"></div>
</div>

<script>
const SB_URL = 'https://unbvutpxilsszdwtcuvq.supabase.co';
const SB_KEY = 'sb_publishable_svGnaOsBazxcphzdKLqhtw_QqW5xK4U';

const HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
};

const TABLES = [
  'productos',
  'ventas',
  'movimientos',
  'clientes',
  'proveedores',
  'maquinas',
  'alquileres',
  'directv',
  'matafuegos',
  'renovables_cotizaciones'
];

function log(message, type = 'info') {
  const statusDiv = document.getElementById('status');
  const item = document.createElement('div');
  item.className = `status-item ${type}`;
  item.textContent = message;
  statusDiv.appendChild(item);
  statusDiv.scrollTop = statusDiv.scrollHeight;
}

async function fetchAllRows(table) {
  let allRows = [];
  let page = 0;
  let hasMore = true;
  
  while (hasMore) {
    try {
      const start = page * 1000;
      const r = await fetch(
        `${SB_URL}/rest/v1/${table}?limit=1000&offset=${start}&order=id.desc`,
        {headers: HEADERS}
      );
      
      if (!r.ok) {
        const error = await r.text();
        log(`${table}: Error HTTP ${r.status}`, 'error');
        console.error(error);
        return [];
      }
      
      const rows = await r.json();
      if (!Array.isArray(rows) || rows.length === 0) {
        hasMore = false;
      } else {
        allRows = allRows.concat(rows);
        page++;
      }
    } catch (e) {
      log(`${table}: ${e.message}`, 'error');
      return [];
    }
  }
  
  return allRows;
}

async function startExport() {
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  
  document.getElementById('status').innerHTML = '';
  document.getElementById('summary').innerHTML = '';
  document.getElementById('summary').classList.remove('show');
  
  log('Iniciando exportación...', 'info');
  
  const exportData = {};
  const summary = {};
  
  for (const table of TABLES) {
    log(`Exportando ${table}...`, 'loading');
    const rows = await fetchAllRows(table);
    exportData[table] = rows;
    summary[table] = rows.length;
    log(`${table}: ${rows.length} registros`, rows.length > 0 ? 'success' : 'info');
  }
  
  // Mostrar resumen
  const summaryDiv = document.getElementById('summary');
  let summaryHtml = '<div style="font-weight: 600; margin-bottom: 10px;">📊 Resumen de Exportación</div>';
  let totalRecords = 0;
  for (const [table, count] of Object.entries(summary)) {
    summaryHtml += `<div class="summary-item"><span>${table}</span><span class="text-success">${count}</span></div>`;
    totalRecords += count;
  }
  summaryHtml += `<div class="summary-item" style="border-bottom: none; font-weight: 600; margin-top: 10px; padding-top: 10px; border-top: 1px solid #30363d;"><span>TOTAL</span><span class="text-success">${totalRecords}</span></div>`;
  summaryDiv.innerHTML = summaryHtml;
  summaryDiv.classList.add('show');
  
  // Descargar JSON
  log('Descargando archivo...', 'info');
  const blob = new Blob(
    [JSON.stringify(exportData, null, 2)],
    {type: 'application/json'}
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `casa-leo-backup-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  log('✅ Exportación completada y descargada', 'success');
  btn.disabled = false;
  window.EXPORTED_DATA = exportData;
}
</script>

</body>
</html>
